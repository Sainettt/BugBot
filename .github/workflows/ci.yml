name: CI

# Runs on every push and pull request; the deployment plan reuses it as its gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    name: lint · types · tests · build
    runs-on: ubuntu-latest

    # The API suite talks to a real Postgres (schema bugbot_test), same as locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bugbot
          POSTGRES_PASSWORD: bugbot
          POSTGRES_DB: bugbot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bugbot -d bugbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm test` reads the repo-root .env through dotenv-cli; CI has no secrets to put in it.
      - name: Write the CI .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="postgresql://bugbot:bugbot@localhost:5432/bugbot?schema=public"
          ADMIN_EMAILS="ci@bugbot.test"
          SEED_DEMO=false
          EOF

      # The apps import @bugbot/shared from its dist, and the api's types need the Prisma client.
      - run: pnpm --filter @bugbot/shared build
      - run: pnpm --filter @bugbot/api run prisma:generate

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build

  images:
    name: docker images (no push)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api
        run: docker build -f apps/api/Dockerfile -t bugbot-api:ci .
      - name: web
        run: docker build -f apps/web/Dockerfile -t bugbot-web:ci .
      - name: agent-runner
        run: docker build -f apps/agent-runner/Dockerfile -t bugbot-agent-runner:ci .
