<!-- @dsCard group="Основа" height=240 subtitle="Вкладки раздела и сегментный переключатель" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-100); }
  .max { max-width: 620px; }
  .pane { padding: 16px 12px; color: var(--ink-200); font-size: 13px; line-height: 19px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); margin: 24px 0 10px; }
</style>
</head>
<body class="rl-root">
  <div class="max">
    <div class="rl-tabs" role="tablist">
      <button class="rl-tab" role="tab" aria-selected="true">Сводка</button>
      <button class="rl-tab" role="tab" aria-selected="false">Контекст JSON</button>
      <button class="rl-tab" role="tab" aria-selected="false">Письмо</button>
      <button class="rl-tab" role="tab" aria-selected="false">История</button>
    </div>
    <div class="pane" role="tabpanel">
      Вкладки переключают представление одного и того же репорта — сначала понятный
      текст, только потом машинный контекст.
    </div>

    <div class="lbl">Сегментный переключатель</div>
    <div class="rl-seg" role="group" aria-label="Насколько мешает">
      <button aria-pressed="false">Мелочь</button>
      <button aria-pressed="true">Мешает работе</button>
      <button aria-pressed="false">Блокирует</button>
    </div>
  </div>
</body>
</html>
